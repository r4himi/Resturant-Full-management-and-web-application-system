{% extends 'menu/base.html' %}
{% load static %}
{% block title %}Profile | BigBurgers{% endblock %}

{% block content %}
<div class="profile-container">

  <div class="profile-card">

    <h1>Welcome {{ request.user.username }}</h1>
    <p>Edit Profile</p>

    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="profile-img-wrapper">

    <img 
        src="{% if profile.image %}{{ profile.image.url }}
        {% else %}
        {% static 'images/default.jpg' %}
        {% endif %}" 
        class="profile-img" 
        id="profilePreview"
    >

    <label for="id_image" class="camera-icon">
        <i class="fa-solid fa-camera"></i>
    </label>

    <input type="file" name="image" id="id_image" accept="image/*" hidden>

    </div>

    <div class="form-group">
        <label>Username</label>
        {{ u_form.username }}
    </div>

    <div class="form-group">
        <label>Email</label>
        {{ u_form.email }}
    </div>

    <button type="submit" class="btn-primary">Save Changes</button>
</form>

    <!-- USER INFO -->
    <div class="actions">
      <a class="link" href="{% url 'change_password' %}">Change Password</a>

      <form method="POST" action="{% url 'delete_account' %}">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Delete Account</button>
      </form>
    </div>

  </div>

</div>

<script>
    const fileInput = document.getElementById('id_image');
    const imgPreview = document.getElementById('profilePreview');

    fileInput.addEventListener('change', function () {
        const file = this.files[0];

        if (file) {
            imgPreview.src = URL.createObjectURL(file);
            imgPreview.style.display = "block";
        }
    });
</script>

{% endblock %}
